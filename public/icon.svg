<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="jarvisCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="90%" stop-color="#0369a1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#030712" />

  <!-- Outer HUD Ring and Ticks -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="4,8" opacity="0.6" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="16,12" opacity="0.7" />

  <!-- Segmented Arc Reactor Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#00f2fe" stroke-width="6" stroke-dasharray="70 20" filter="url(#cyanGlow)" opacity="0.9" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.8" />

  <!-- Radial HUD Spokes -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7" filter="url(#cyanGlow)">
    <line x1="256" y1="68" x2="256" y2="108" />
    <line x1="256" y1="404" x2="256" y2="444" />
    <line x1="68" y1="256" x2="108" y2="256" />
    <line x1="404" y1="256" x2="444" y2="256" />

    <line x1="123" y1="123" x2="151" y2="151" />
    <line x1="361" y1="361" x2="389" y2="389" />
    <line x1="389" y1="123" x2="361" y2="151" />
    <line x1="151" y1="361" x2="123" y2="389" />
  </g>

  <!-- Middle Mechanical Ring & Coils -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="24 12" opacity="0.85" />
  <circle cx="256" cy="256" r="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" opacity="0.9" />

  <!-- Inner Glowing Core Background -->
  <circle cx="256" cy="256" r="90" fill="url(#jarvisCoreGlow)" />

  <!-- Inner High-Intensity Core -->
  <circle cx="256" cy="256" r="54" fill="#00f2fe" filter="url(#cyanGlow)" opacity="0.9" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#cyanGlow)" />

  <!-- Tech Center Crosshair -->
  <circle cx="256" cy="256" r="14" fill="none" stroke="#0284c7" stroke-width="2" />
</svg>
